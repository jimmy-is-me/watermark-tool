<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>批次浮水印工具</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap" rel="stylesheet">
<style>
/* ===== DESIGN TOKENS ===== */
:root, [data-theme="light"] {
  --text-xs: clamp(0.75rem, 0.7rem + 0.25vw, 0.875rem);
  --text-sm: clamp(0.875rem, 0.8rem + 0.35vw, 1rem);
  --text-base: clamp(1rem, 0.95rem + 0.25vw, 1.125rem);
  --text-lg: clamp(1.125rem, 1rem + 0.75vw, 1.5rem);
  --text-xl: clamp(1.5rem, 1.2rem + 1.25vw, 2.25rem);

  --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem;
  --space-4: 1rem; --space-5: 1.25rem; --space-6: 1.5rem;
  --space-8: 2rem; --space-10: 2.5rem; --space-12: 3rem;
  --space-16: 4rem;

  --color-bg: #f7f6f2;
  --color-surface: #f9f8f5;
  --color-surface-2: #fbfbf9;
  --color-surface-offset: #f3f0ec;
  --color-surface-dynamic: #e6e4df;
  --color-divider: #dcd9d5;
  --color-border: #d4d1ca;
  --color-text: #28251d;
  --color-text-muted: #7a7974;
  --color-text-faint: #bab9b4;
  --color-primary: #01696f;
  --color-primary-hover: #0c4e54;
  --color-primary-highlight: #cedcd8;
  --color-error: #a12c7b;
  --color-success: #437a22;

  --radius-sm: 0.375rem; --radius-md: 0.5rem;
  --radius-lg: 0.75rem; --radius-xl: 1rem; --radius-full: 9999px;
  --transition-interactive: 180ms cubic-bezier(0.16, 1, 0.3, 1);
  --shadow-sm: 0 1px 2px oklch(0.2 0.01 80 / 0.06);
  --shadow-md: 0 4px 12px oklch(0.2 0.01 80 / 0.08);
  --shadow-lg: 0 12px 32px oklch(0.2 0.01 80 / 0.12);
  --font-body: 'Inter', system-ui, sans-serif;
  --content-default: 1100px;
}
[data-theme="dark"] {
  --color-bg: #171614; --color-surface: #1c1b19; --color-surface-2: #201f1d;
  --color-surface-offset: #1d1c1a; --color-surface-dynamic: #2d2c2a;
  --color-divider: #262523; --color-border: #393836;
  --color-text: #cdccca; --color-text-muted: #797876; --color-text-faint: #5a5957;
  --color-primary: #4f98a3; --color-primary-hover: #227f8b;
  --color-primary-highlight: #313b3b;
  --color-error: #d163a7; --color-success: #6daa45;
  --shadow-sm: 0 1px 2px oklch(0 0 0 / 0.2);
  --shadow-md: 0 4px 12px oklch(0 0 0 / 0.3);
  --shadow-lg: 0 12px 32px oklch(0 0 0 / 0.4);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    --color-bg: #171614; --color-surface: #1c1b19; --color-surface-2: #201f1d;
    --color-surface-offset: #1d1c1a; --color-surface-dynamic: #2d2c2a;
    --color-divider: #262523; --color-border: #393836;
    --color-text: #cdccca; --color-text-muted: #797876; --color-text-faint: #5a5957;
    --color-primary: #4f98a3; --color-primary-hover: #227f8b;
    --color-primary-highlight: #313b3b;
    --color-error: #d163a7; --color-success: #6daa45;
  }
}

/* ===== BASE ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }
body {
  min-height: 100dvh; font-family: var(--font-body);
  font-size: var(--text-base); color: var(--color-text);
  background: var(--color-bg);
}
img, canvas { display: block; max-width: 100%; }
input, button, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: none; }
:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 3px; border-radius: var(--radius-sm); }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

/* ===== LAYOUT ===== */
.app-wrapper { display: flex; flex-direction: column; min-height: 100dvh; }

header {
  position: sticky; top: 0; z-index: 100;
  background: var(--color-surface);
  border-bottom: 1px solid var(--color-border);
  box-shadow: var(--shadow-sm);
}
.header-inner {
  max-width: var(--content-default); margin: 0 auto;
  padding: var(--space-3) var(--space-6);
  display: flex; align-items: center; justify-content: space-between; gap: var(--space-4);
}
.logo { display: flex; align-items: center; gap: var(--space-3); text-decoration: none; color: var(--color-text); }
.logo-img { height: 36px; width: auto; display: block; object-fit: contain; }
.logo-divider {
  width: 1px; height: 22px;
  background: var(--color-border);
  flex-shrink: 0;
}
.logo-text { font-size: var(--text-sm); font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; }
.header-actions { display: flex; align-items: center; gap: var(--space-2); }
.theme-toggle {
  width: 36px; height: 36px; border-radius: var(--radius-full);
  display: flex; align-items: center; justify-content: center;
  color: var(--color-text-muted); transition: background var(--transition-interactive), color var(--transition-interactive);
}
.theme-toggle:hover { background: var(--color-surface-offset); color: var(--color-text); }

/* ===== AUTH BUTTON ===== */
.auth-btn {
  display: inline-flex; align-items: center; gap: var(--space-2);
  padding: var(--space-1) var(--space-3); border-radius: var(--radius-md);
  font-size: var(--text-xs); font-weight: 500;
  border: 1px solid var(--color-border);
  background: var(--color-surface-offset);
  color: var(--color-text);
  transition: background var(--transition-interactive), border-color var(--transition-interactive);
  cursor: pointer; white-space: nowrap;
}
.auth-btn:hover { background: var(--color-surface-dynamic); border-color: var(--color-primary); }
.auth-btn.logged-in { border-color: var(--color-primary); background: var(--color-primary-highlight); color: var(--color-primary-hover); }
.auth-btn svg { flex-shrink: 0; }

main { flex: 1; max-width: var(--content-default); margin: 0 auto; width: 100%; padding: var(--space-8) var(--space-6); }

/* ===== SECTION TITLES ===== */
.section-title { font-size: var(--text-lg); font-weight: 600; margin-bottom: var(--space-4); display: flex; align-items: center; gap: var(--space-2); }
.section-title svg { color: var(--color-primary); flex-shrink: 0; }

/* ===== CARDS ===== */
.card {
  background: var(--color-surface); border: 1px solid var(--color-border);
  border-radius: var(--radius-xl); padding: var(--space-6); box-shadow: var(--shadow-sm);
}
.card + .card { margin-top: var(--space-6); }

/* ===== TWO-COL GRID ===== */
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-6); }
@media (max-width: 768px) { .two-col { grid-template-columns: 1fr; } }

/* ===== FORM CONTROLS ===== */
.form-group { display: flex; flex-direction: column; gap: var(--space-2); margin-bottom: var(--space-4); }
.form-group:last-child { margin-bottom: 0; }
label { font-size: var(--text-sm); font-weight: 500; color: var(--color-text-muted); }
input[type="text"], input[type="number"], input[type="email"], input[type="password"], select, textarea {
  background: var(--color-bg); border: 1px solid var(--color-border);
  border-radius: var(--radius-md); padding: var(--space-2) var(--space-3);
  font-size: var(--text-sm); color: var(--color-text);
  transition: border-color var(--transition-interactive), box-shadow var(--transition-interactive);
  width: 100%;
}
input[type="text"]:focus, input[type="number"]:focus, input[type="email"]:focus, input[type="password"]:focus, select:focus, textarea:focus {
  border-color: var(--color-primary); box-shadow: 0 0 0 3px var(--color-primary-highlight);
  outline: none;
}
input[type="range"] { width: 100%; accent-color: var(--color-primary); cursor: pointer; }
input[type="color"] { width: 44px; height: 36px; border: 1px solid var(--color-border); border-radius: var(--radius-md); cursor: pointer; padding: 2px; background: var(--color-bg); }

.row-inline { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; }
.row-inline label { min-width: 60px; margin: 0; }
.range-value { font-size: var(--text-sm); color: var(--color-text-muted); min-width: 2.5em; text-align: right; }

/* ===== BUTTONS ===== */
.btn {
  display: inline-flex; align-items: center; gap: var(--space-2);
  padding: var(--space-2) var(--space-5); border-radius: var(--radius-md);
  font-size: var(--text-sm); font-weight: 500;
  transition: background var(--transition-interactive), color var(--transition-interactive), box-shadow var(--transition-interactive);
  cursor: pointer; border: none; text-decoration: none; white-space: nowrap;
}
.btn-primary { background: var(--color-primary); color: #fff; }
.btn-primary:hover { background: var(--color-primary-hover); box-shadow: var(--shadow-md); }
.btn-secondary { background: var(--color-surface-offset); color: var(--color-text); border: 1px solid var(--color-border); }
.btn-secondary:hover { background: var(--color-surface-dynamic); }
.btn-ghost { color: var(--color-text-muted); }
.btn-ghost:hover { background: var(--color-surface-offset); color: var(--color-text); }
.btn-success { background: var(--color-success); color: #fff; }
.btn-success:hover { filter: brightness(0.9); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; pointer-events: none; }
.btn-icon { padding: var(--space-2); border-radius: var(--radius-md); }
.btn-sm { padding: var(--space-1) var(--space-3); font-size: var(--text-xs); }
.action-bar { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; margin-top: var(--space-6); }

/* ===== UPLOAD ZONE ===== */
.upload-zone {
  border: 2px dashed var(--color-border); border-radius: var(--radius-xl);
  padding: var(--space-12) var(--space-8); text-align: center;
  cursor: pointer; transition: border-color var(--transition-interactive), background var(--transition-interactive);
  display: flex; flex-direction: column; align-items: center; gap: var(--space-3);
}
.upload-zone:hover, .upload-zone.dragover {
  border-color: var(--color-primary); background: oklch(from var(--color-primary) l c h / 0.04);
}
.upload-zone .upload-icon { color: var(--color-primary); margin-bottom: var(--space-2); }
.upload-zone h3 { font-size: var(--text-base); font-weight: 600; }
.upload-zone p { font-size: var(--text-sm); color: var(--color-text-muted); }
#fileInput { display: none; }

/* ===== IMAGE GRID ===== */
.image-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: var(--space-3);
  margin-top: var(--space-4);
}
.image-thumb {
  position: relative; border-radius: var(--radius-lg); overflow: hidden;
  background: var(--color-surface-offset); aspect-ratio: 1 / 1;
  box-shadow: var(--shadow-sm);
  transition: box-shadow var(--transition-interactive), transform var(--transition-interactive);
}
.image-thumb:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
.image-thumb img { width: 100%; height: 100%; object-fit: cover; }
.image-thumb .remove-btn {
  position: absolute; top: var(--space-1); right: var(--space-1);
  width: 24px; height: 24px; border-radius: var(--radius-full);
  background: oklch(0 0 0 / 0.55); color: #fff;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; transition: opacity var(--transition-interactive);
  font-size: 11px; font-weight: 600;
}
.image-thumb:hover .remove-btn { opacity: 1; }
.image-thumb .remove-btn:hover { background: oklch(0.45 0.2 10 / 0.9); }
.status-badge {
  position: absolute; bottom: var(--space-1); left: var(--space-1);
  padding: 2px var(--space-2); border-radius: var(--radius-full);
  font-size: 10px; font-weight: 600;
}
.status-badge.done { background: var(--color-success); color: #fff; }

/* ===== PREVIEW AREA ===== */
.preview-wrap {
  background: repeating-conic-gradient(var(--color-surface-offset) 0% 25%, var(--color-bg) 0% 50%) 0 0 / 16px 16px;
  border: 1px solid var(--color-border); border-radius: var(--radius-lg);
  display: flex; align-items: center; justify-content: center;
  min-height: 300px; overflow: hidden; padding: var(--space-4);
}
#previewCanvas { max-width: 100%; max-height: 420px; object-fit: contain; border-radius: var(--radius-md); box-shadow: var(--shadow-md); }

/* ===== WATERMARK OPTIONS TABS ===== */
.tab-bar { display: flex; gap: var(--space-1); border-bottom: 1px solid var(--color-border); margin-bottom: var(--space-5); }
.tab-btn {
  padding: var(--space-2) var(--space-4); font-size: var(--text-sm); font-weight: 500;
  color: var(--color-text-muted); border-radius: var(--radius-md) var(--radius-md) 0 0;
  border: none; background: none; cursor: pointer; border-bottom: 2px solid transparent;
  transition: color var(--transition-interactive), border-color var(--transition-interactive);
  margin-bottom: -1px;
}
.tab-btn.active { color: var(--color-primary); border-bottom-color: var(--color-primary); }
.tab-btn:hover:not(.active) { color: var(--color-text); background: var(--color-surface-offset); }
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* ===== PROGRESS ===== */
.progress-wrap { margin-top: var(--space-4); }
.progress-bar-bg { background: var(--color-surface-offset); border-radius: var(--radius-full); height: 8px; overflow: hidden; }
.progress-bar-fill {
  height: 100%; background: var(--color-primary); border-radius: var(--radius-full);
  transition: width 0.3s ease; width: 0%;
}
.progress-text { font-size: var(--text-xs); color: var(--color-text-muted); margin-top: var(--space-1); }

/* ===== STATS BAR ===== */
.stats-bar {
  display: flex; gap: var(--space-6); padding: var(--space-3) var(--space-5);
  background: var(--color-surface); border: 1px solid var(--color-border);
  border-radius: var(--radius-lg); margin-bottom: var(--space-6);
  flex-wrap: wrap;
}
.stat-item { display: flex; flex-direction: column; gap: 2px; }
.stat-value { font-size: var(--text-lg); font-weight: 700; color: var(--color-text); font-variant-numeric: tabular-nums; }
.stat-label { font-size: var(--text-xs); color: var(--color-text-muted); }

/* ===== POSITION GRID ===== */
.position-grid { display: grid; grid-template-columns: repeat(3, 40px); gap: 4px; }
.pos-btn {
  width: 40px; height: 40px; border-radius: var(--radius-sm);
  border: 1px solid var(--color-border); background: var(--color-surface-offset);
  cursor: pointer; transition: background var(--transition-interactive), border-color var(--transition-interactive);
  display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--color-text-faint);
}
.pos-btn.active { background: var(--color-primary); border-color: var(--color-primary); }
.pos-btn:hover:not(.active) { background: var(--color-primary-highlight); border-color: var(--color-primary); }

/* ===== EMPTY STATE ===== */
.empty-state { display: flex; flex-direction: column; align-items: center; text-align: center; padding: var(--space-16) var(--space-8); color: var(--color-text-muted); }
.empty-state svg { color: var(--color-text-faint); margin-bottom: var(--space-4); }
.empty-state h3 { font-size: var(--text-base); color: var(--color-text); margin-bottom: var(--space-2); }
.empty-state p { font-size: var(--text-sm); max-width: 30ch; }

/* ===== BADGE ===== */
.badge { display: inline-flex; align-items: center; padding: 2px var(--space-2); border-radius: var(--radius-full); font-size: var(--text-xs); font-weight: 600; }
.badge-primary { background: var(--color-primary-highlight); color: var(--color-primary-hover); }
.badge-count { background: var(--color-primary); color: #fff; }

/* ===== FOOTER ===== */
footer { border-top: 1px solid var(--color-divider); padding: var(--space-4) var(--space-6); text-align: center; font-size: var(--text-xs); color: var(--color-text-faint); }

/* ===== TOAST ===== */
.toast-container { position: fixed; bottom: var(--space-6); right: var(--space-6); z-index: 9999; display: flex; flex-direction: column; gap: var(--space-2); }
.toast {
  background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg);
  padding: var(--space-3) var(--space-5); box-shadow: var(--shadow-lg);
  font-size: var(--text-sm); display: flex; align-items: center; gap: var(--space-2);
  animation: slideIn 0.3s ease; max-width: 320px;
}
.toast.success { border-left: 3px solid var(--color-success); }
.toast.error { border-left: 3px solid var(--color-error); }
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
@keyframes slideOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }

/* ===== WATERMARK TILE REPEAT ===== */
.tile-section { display: none; }
.tile-section.visible { display: block; }

/* ===== AUTH MODAL ===== */
.modal-overlay {
  position: fixed; inset: 0; z-index: 1000;
  background: oklch(0.1 0 0 / 0.55);
  display: flex; align-items: center; justify-content: center;
  padding: var(--space-4);
  opacity: 0; pointer-events: none;
  transition: opacity 0.2s ease;
}
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal {
  background: var(--color-surface); border: 1px solid var(--color-border);
  border-radius: var(--radius-xl); padding: var(--space-8);
  width: 100%; max-width: 420px; box-shadow: var(--shadow-lg);
  transform: translateY(12px);
  transition: transform 0.2s ease;
}
.modal-overlay.open .modal { transform: translateY(0); }
.modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-6); }
.modal-title { font-size: var(--text-lg); font-weight: 700; }
.modal-close {
  width: 32px; height: 32px; border-radius: var(--radius-full);
  display: flex; align-items: center; justify-content: center;
  color: var(--color-text-muted); transition: background var(--transition-interactive);
}
.modal-close:hover { background: var(--color-surface-offset); color: var(--color-text); }
.modal-tabs { display: flex; border-bottom: 1px solid var(--color-border); margin-bottom: var(--space-6); }
.modal-tab {
  flex: 1; padding: var(--space-2); text-align: center;
  font-size: var(--text-sm); font-weight: 500; color: var(--color-text-muted);
  cursor: pointer; border: none; background: none;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
  transition: color var(--transition-interactive), border-color var(--transition-interactive);
}
.modal-tab.active { color: var(--color-primary); border-bottom-color: var(--color-primary); }
.modal-form { display: none; }
.modal-form.active { display: block; }
.modal-footer { margin-top: var(--space-4); text-align: center; font-size: var(--text-xs); color: var(--color-text-muted); }
.modal-footer a { color: var(--color-primary); cursor: pointer; text-decoration: none; }
.modal-footer a:hover { text-decoration: underline; }
.auth-error { font-size: var(--text-xs); color: var(--color-error); margin-top: var(--space-2); display: none; padding: var(--space-2) var(--space-3); background: oklch(from var(--color-error) l c h / 0.08); border-radius: var(--radius-md); }
.auth-error.show { display: block; }

/* ===== PRESET BANNER ===== */
.preset-banner {
  display: none; align-items: center; gap: var(--space-3);
  padding: var(--space-3) var(--space-4);
  background: var(--color-primary-highlight);
  border: 1px solid oklch(from var(--color-primary) l c h / 0.25);
  border-radius: var(--radius-lg);
  margin-bottom: var(--space-4);
  font-size: var(--text-sm);
}
.preset-banner.show { display: flex; }
.preset-banner svg { color: var(--color-primary); flex-shrink: 0; }
.preset-banner-text { flex: 1; color: var(--color-primary-hover); }
.preset-banner-actions { display: flex; gap: var(--space-2); }

/* ===== USER DROPDOWN ===== */
.user-menu-wrap { position: relative; }
.user-dropdown {
  position: absolute; top: calc(100% + var(--space-2)); right: 0;
  background: var(--color-surface); border: 1px solid var(--color-border);
  border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);
  min-width: 200px; padding: var(--space-2);
  display: none; z-index: 500;
}
.user-dropdown.open { display: block; }
.dropdown-item {
  display: flex; align-items: center; gap: var(--space-2);
  padding: var(--space-2) var(--space-3); border-radius: var(--radius-md);
  font-size: var(--text-sm); color: var(--color-text); cursor: pointer;
  transition: background var(--transition-interactive);
  width: 100%; text-align: left; border: none; background: none;
}
.dropdown-item:hover { background: var(--color-surface-offset); }
.dropdown-item.danger { color: var(--color-error); }
.dropdown-item.danger:hover { background: oklch(from var(--color-error) l c h / 0.08); }
.dropdown-divider { height: 1px; background: var(--color-divider); margin: var(--space-1) 0; }
.dropdown-user-info { padding: var(--space-2) var(--space-3) var(--space-1); }
.dropdown-username { font-size: var(--text-sm); font-weight: 600; color: var(--color-text); }
.dropdown-email { font-size: var(--text-xs); color: var(--color-text-muted); }

@media (max-width: 600px) {
  main { padding: var(--space-4) var(--space-3); }
  .stats-bar { gap: var(--space-4); }
  .position-grid { grid-template-columns: repeat(3, 36px); }
  .pos-btn { width: 36px; height: 36px; }
  .logo-text { display: none; }
  .logo-divider { display: none; }
}
</style>
</head>
<body>
<div class="app-wrapper">

<!-- HEADER -->
<header>
  <div class="header-inner">
    <a href="#" class="logo">
      <img src="./logo.png" alt="批次浮水印工具" class="logo-img" height="36" width="auto" loading="eager">

<script>
// ===== CONFIG =====
const WP_URL = 'https://watermark.wulk.cc';
const API = {
  token:    `${WP_URL}/wp-json/jwt-auth/v1/token`,
  register: `${WP_URL}/wp-json/wp/v2/users/register`,
  me:       `${WP_URL}/wp-json/wp/v2/users/me`,
  meta:     `${WP_URL}/wp-json/watermark/v1/preset`,
};

// ===== AUTH STATE =====
const auth = { token: null, user: null, preset: null };

// ===== STATE =====
const state = {
  files: [],
  processedBlobs: [],
  wmImage: null,
  selectedPos: 'center',
  activeTab: 'text',
  previewIndex: 0,
};

// ===== THEME TOGGLE =====
(function(){
  const t = document.querySelector('[data-theme-toggle]');
  const r = document.documentElement;
  let d = matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light';
  r.setAttribute('data-theme', d);
  t.innerHTML = d === 'dark'
    ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>'
    : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
  if(t) t.addEventListener('click', () => {
    d = d === 'dark' ? 'light' : 'dark';
    r.setAttribute('data-theme', d);
    t.innerHTML = d === 'dark'
      ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>'
      : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
  });
})();

// ===== TOAST =====
function showToast(msg, type = 'success') {
  const c = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<span>${type === 'success' ? '✓' : '✕'}</span><span>${msg}</span>`;
  c.appendChild(el);
  setTimeout(() => {
    el.style.animation = 'slideOut 0.3s ease forwards';
    setTimeout(() => el.remove(), 300);
  }, 3500);
}

// ===== AUTH MODAL =====
function openAuthModal() {
  document.getElementById('authModal').classList.add('open');
  document.getElementById('loginUsername').focus();
}
function closeAuthModal() {
  document.getElementById('authModal').classList.remove('open');
}
function switchModalTab(tab) {
  document.querySelectorAll('.modal-tab').forEach(b => b.classList.toggle('active', b.dataset.modalTab === tab));
  document.querySelectorAll('.modal-form').forEach(f => f.classList.toggle('active', f.id === 'modal-' + tab));
  document.getElementById('modalTitle').textContent = tab === 'login' ? '會員登入' : '建立新帳號';
}

document.getElementById('btnOpenAuth').addEventListener('click', openAuthModal);
document.getElementById('modalClose').addEventListener('click', closeAuthModal);
document.getElementById('authModal').addEventListener('click', e => { if(e.target === e.currentTarget) closeAuthModal(); });
document.querySelectorAll('.modal-tab').forEach(btn => btn.addEventListener('click', () => switchModalTab(btn.dataset.modalTab)));

// ===== LOGIN =====
document.getElementById('btnLogin').addEventListener('click', async () => {
  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');
  errEl.classList.remove('show');
  if (!username || !password) { errEl.textContent = '請填寫帳號與密碼'; errEl.classList.add('show'); return; }

  const btn = document.getElementById('btnLogin');
  btn.disabled = true; btn.textContent = '登入中...';

  try {
    const res = await fetch(API.token, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.message || '帳號或密碼錯誤');

    auth.token = data.token;
    auth.user = { name: data.user_display_name, email: data.user_email, nicename: data.user_nicename };
    closeAuthModal();
    onLoginSuccess();
  } catch(e) {
    errEl.textContent = e.message;
    errEl.classList.add('show');
  } finally {
    btn.disabled = false; btn.textContent = '登入';
  }
});

// ===== REGISTER =====
document.getElementById('btnRegister').addEventListener('click', async () => {
  const username = document.getElementById('regUsername').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const password = document.getElementById('regPassword').value;
  const errEl = document.getElementById('registerError');
  errEl.classList.remove('show');
  if (!username || !email || !password) { errEl.textContent = '請填寫所有欄位'; errEl.classList.add('show'); return; }
  if (password.length < 8) { errEl.textContent = '密碼至少需要 8 個字元'; errEl.classList.add('show'); return; }

  const btn = document.getElementById('btnRegister');
  btn.disabled = true; btn.textContent = '建立中...';

  try {
    const res = await fetch(API.register, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, email, password })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.message || '註冊失敗，請換個帳號名稱或信箱');

    showToast('帳號建立成功！請登入');
    switchModalTab('login');
    document.getElementById('loginUsername').value = username;
  } catch(e) {
    errEl.textContent = e.message;
    errEl.classList.add('show');
  } finally {
    btn.disabled = false; btn.textContent = '建立帳號';
  }
});

// ===== ON LOGIN SUCCESS =====
function onLoginSuccess() {
  document.getElementById('btnOpenAuth').style.display = 'none';
  document.getElementById('userMenuWrap').style.display = 'flex';
  document.getElementById('headerUsername').textContent = auth.user.name;
  document.getElementById('dropdownUsername').textContent = auth.user.name;
  document.getElementById('dropdownEmail').textContent = auth.user.email;
  document.getElementById('btnSavePresetInline').style.display = 'inline-flex';
  showToast(`歡迎回來，${auth.user.name}！`);
  fetchPreset();
}

// ===== LOGOUT =====
document.getElementById('btnLogout').addEventListener('click', () => {
  auth.token = null; auth.user = null; auth.preset = null;
  document.getElementById('btnOpenAuth').style.display = 'flex';
  document.getElementById('userMenuWrap').style.display = 'none';
  document.getElementById('btnSavePresetInline').style.display = 'none';
  document.getElementById('presetBanner').classList.remove('show');
  document.getElementById('userDropdown').classList.remove('open');
  showToast('已登出');
});

// ===== USER DROPDOWN =====
document.getElementById('btnUserMenu').addEventListener('click', (e) => {
  e.stopPropagation();
  document.getElementById('userDropdown').classList.toggle('open');
});
document.addEventListener('click', () => document.getElementById('userDropdown').classList.remove('open'));

// ===== PRESET: FETCH =====
async function fetchPreset() {
  if (!auth.token) return;
  try {
    const res = await fetch(API.meta, {
      headers: { 'Authorization': `Bearer ${auth.token}` }
    });
    if (!res.ok) return;
    const data = await res.json();
    if (data && data.preset) {
      auth.preset = data.preset;
      document.getElementById('presetBanner').classList.add('show');
    }
  } catch(e) { /* silent */ }
}

// ===== PRESET: COLLECT CURRENT SETTINGS =====
function collectSettings() {
  return {
    wmText: document.getElementById('wmText').value,
    wmFont: document.getElementById('wmFont').value,
    wmFontSize: document.getElementById('wmFontSize').value,
    wmColor: document.getElementById('wmColor').value,
    wmOpacity: document.getElementById('wmOpacity').value,
    wmRotation: document.getElementById('wmRotation').value,
    wmImgSize: document.getElementById('wmImgSize').value,
    wmTileGap: document.getElementById('wmTileGap').value,
    wmTile: document.getElementById('wmTile').checked,
    selectedPos: state.selectedPos,
    activeTab: state.activeTab,
    outputFormat: document.getElementById('outputFormat').value,
    outputQuality: document.getElementById('outputQuality').value,
  };
}

// ===== PRESET: APPLY SETTINGS =====
function applySettings(s) {
  if (!s) return;
  if (s.wmText !== undefined) document.getElementById('wmText').value = s.wmText;
  if (s.wmFont !== undefined) document.getElementById('wmFont').value = s.wmFont;
  if (s.wmFontSize !== undefined) { document.getElementById('wmFontSize').value = s.wmFontSize; document.getElementById('wmFontSizeVal').textContent = s.wmFontSize + 'px'; }
  if (s.wmColor !== undefined) document.getElementById('wmColor').value = s.wmColor;
  if (s.wmOpacity !== undefined) { document.getElementById('wmOpacity').value = s.wmOpacity; document.getElementById('wmOpacityVal').textContent = s.wmOpacity + '%'; }
  if (s.wmRotation !== undefined) { document.getElementById('wmRotation').value = s.wmRotation; document.getElementById('wmRotationVal').textContent = s.wmRotation + '°'; }
  if (s.wmImgSize !== undefined) { document.getElementById('wmImgSize').value = s.wmImgSize; document.getElementById('wmImgSizeVal').textContent = s.wmImgSize + '%'; }
  if (s.wmTileGap !== undefined) { document.getElementById('wmTileGap').value = s.wmTileGap; document.getElementById('wmTileGapVal').textContent = s.wmTileGap + 'px'; }
  if (s.wmTile !== undefined) { document.getElementById('wmTile').checked = s.wmTile; document.getElementById('tileSection').classList.toggle('visible', s.wmTile); }
  if (s.outputFormat !== undefined) { document.getElementById('outputFormat').value = s.outputFormat; document.getElementById('statFormat').textContent = s.outputFormat.split('/')[1].toUpperCase(); }
  if (s.outputQuality !== undefined) { document.getElementById('outputQuality').value = s.outputQuality; document.getElementById('outputQualityVal').textContent = s.outputQuality + '%'; }
  if (s.selectedPos) {
    state.selectedPos = s.selectedPos;
    document.querySelectorAll('.pos-btn').forEach(b => b.classList.toggle('active', b.dataset.pos === s.selectedPos));
  }
  if (s.activeTab) {
    state.activeTab = s.activeTab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === s.activeTab));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'tab-' + s.activeTab));
    document.getElementById('statWmType').textContent = s.activeTab === 'text' ? '文字' : '圖片';
  }
  updatePreview();
}

// ===== PRESET: SAVE =====
async function savePreset() {
  if (!auth.token) { showToast('請先登入', 'error'); openAuthModal(); return; }
  const settings = collectSettings();
  try {
    const res = await fetch(API.meta, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${auth.token}` },
      body: JSON.stringify({ preset: settings })
    });
    if (!res.ok) throw new Error('儲存失敗');
    auth.preset = settings;
    showToast('浮水印設定已儲存！');
  } catch(e) {
    showToast('儲存失敗：' + e.message, 'error');
  }
}

document.getElementById('btnSavePreset').addEventListener('click', () => { document.getElementById('userDropdown').classList.remove('open'); savePreset(); });
document.getElementById('btnSavePresetInline').addEventListener('click', savePreset);
document.getElementById('btnLoadPreset').addEventListener('click', () => {
  document.getElementById('userDropdown').classList.remove('open');
  if (auth.preset) { applySettings(auth.preset); showToast('已載入儲存的設定！'); }
  else { showToast('尚無儲存的設定', 'error'); }
});
document.getElementById('btnApplyPreset').addEventListener('click', () => {
  applySettings(auth.preset);
  document.getElementById('presetBanner').classList.remove('show');
  showToast('已載入儲存的設定！');
});
document.getElementById('btnDismissPreset').addEventListener('click', () => {
  document.getElementById('presetBanner').classList.remove('show');
});

// ===== RANGE INPUTS =====
function bindRange(id, valId, suffix) {
  const el = document.getElementById(id);
  const val = document.getElementById(valId);
  el.addEventListener('input', () => { val.textContent = el.value + suffix; updatePreview(); });
}
bindRange('wmFontSize', 'wmFontSizeVal', 'px');
bindRange('wmOpacity', 'wmOpacityVal', '%');
bindRange('wmRotation', 'wmRotationVal', '°');
bindRange('wmImgSize', 'wmImgSizeVal', '%');
bindRange('wmTileGap', 'wmTileGapVal', 'px');
bindRange('outputQuality', 'outputQualityVal', '%');

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

    updatePreview();

  btn.addEventListener('click', () => {
    document.querySelectorAll('.pos-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.selectedPos = btn.dataset.pos;
    updatePreview();
  });

// ===== TILE TOGGLE =====
document.getElementById('wmTile').addEventListener('change', function() {
  document.getElementById('tileSection').classList.toggle('visible', this.checked);
  updatePreview();
});

// ===== TEXT/COLOR UPDATES =====
['wmText','wmFont','wmColor','outputFormat'].forEach(id => {
  document.getElementById(id).addEventListener('input', updatePreview);
  document.getElementById(id).addEventListener('change', updatePreview);
});
document.getElementById('outputFormat').addEventListener('change', function() {
  document.getElementById('statFormat').textContent = this.value.split('/')[1].toUpperCase();
  const qg = document.getElementById('qualityGroup');
  qg.style.opacity = this.value === 'image/png' ? '0.4' : '1';
  qg.style.pointerEvents = this.value === 'image/png' ? 'none' : '';
});

// ===== FILE UPLOAD =====
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' ') fileInput.click(); });
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
  e.preventDefault(); dropZone.classList.remove('dragover');
  handleFiles(Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/')));
});
fileInput.addEventListener('change', () => handleFiles(Array.from(fileInput.files)));

function handleFiles(newFiles) {
  if (!newFiles.length) return;
  newFiles.forEach(f => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        state.files.push({ file: f, url: e.target.result, img, processed: false });
        renderGrid();
        updateStats();
        if (state.files.length === 1) { state.previewIndex = 0; updatePreview(); }
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(f);
  });
}

// ===== WATERMARK IMAGE UPLOAD =====
document.getElementById('wmFileInput').addEventListener('change', function() {
  if (!this.files[0]) return;
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      state.wmImage = img;
      document.getElementById('wmImgLabel').textContent = '✓ ' + this.files[0].name;
      updatePreview();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(this.files[0]);
});

// ===== RENDER GRID =====
function renderGrid() {
  const grid = document.getElementById('imageGrid');
  if (!state.files.length) { grid.style.display = 'none'; return; }
  grid.style.display = 'grid';
  grid.innerHTML = '';
  state.files.forEach((f, i) => {
    const div = document.createElement('div');
    div.className = 'image-thumb';
    div.innerHTML = `
      <img src="${f.url}" alt="${f.file.name}" loading="lazy" width="160" height="160">
      <button class="remove-btn" aria-label="移除圖片" data-i="${i}">✕</button>
      ${f.processed ? '<span class="status-badge done">完成</span>' : ''}
    `;
    div.querySelector('img').addEventListener('click', () => { state.previewIndex = i; updatePreview(); });
    div.querySelector('.remove-btn').addEventListener('click', e => {
      e.stopPropagation();
      state.files.splice(i, 1);
      state.processedBlobs.splice(i, 1);
      if (state.previewIndex >= state.files.length) state.previewIndex = Math.max(0, state.files.length - 1);
      renderGrid(); updateStats(); updatePreview();
    });
    grid.appendChild(div);
  });
  document.getElementById('btnProcess').disabled = state.files.length === 0;
}

// ===== WATERMARK ENGINE =====
function applyWatermark(img) {
  const canvas = document.createElement('canvas');
  canvas.width = img.naturalWidth || img.width;
  canvas.height = img.naturalHeight || img.height;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0);

  const opacity = parseFloat(document.getElementById('wmOpacity').value) / 100;
  const rotation = parseFloat(document.getElementById('wmRotation').value) * (Math.PI / 180);
  const tiled = document.getElementById('wmTile').checked;
  const pos = state.selectedPos;

  ctx.globalAlpha = opacity;

  if (state.activeTab === 'text') {
    const text = document.getElementById('wmText').value || '浮水印';
    const fontSize = parseInt(document.getElementById('wmFontSize').value);
    const font = document.getElementById('wmFont').value;
    const color = document.getElementById('wmColor').value;

    ctx.font = `${fontSize}px ${font}`;
    ctx.fillStyle = color;
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'center';

    const metrics = ctx.measureText(text);
    const tw = metrics.width;
    const th = fontSize;

    if (tiled) {
      const gap = parseInt(document.getElementById('wmTileGap').value);
      const stepX = tw + gap; const stepY = th + gap;
      for (let y = -canvas.height; y < canvas.height * 2; y += stepY) {
        for (let x = -canvas.width; x < canvas.width * 2; x += stepX) {
          ctx.save(); ctx.translate(x + tw/2, y + th/2); ctx.rotate(rotation);
          ctx.fillText(text, 0, 0); ctx.restore();
        }
      }
    } else {
      const {x, y} = getPosition(pos, canvas.width, canvas.height, tw, th);
      ctx.save(); ctx.translate(x, y); ctx.rotate(rotation); ctx.fillText(text, 0, 0); ctx.restore();
    }

  } else {
    const wmImg = state.wmImage;
    if (!wmImg) return canvas;
    const sizePercent = parseInt(document.getElementById('wmImgSize').value) / 100;
    const scale = (canvas.width * sizePercent) / wmImg.width;
    const ww = wmImg.width * scale; const wh = wmImg.height * scale;

    if (tiled) {
      const gap = parseInt(document.getElementById('wmTileGap').value);
      for (let y = -canvas.height; y < canvas.height * 2; y += wh + gap) {
        for (let x = -canvas.width; x < canvas.width * 2; x += ww + gap) {
          ctx.save(); ctx.translate(x + ww/2, y + wh/2); ctx.rotate(rotation);
          ctx.drawImage(wmImg, -ww/2, -wh/2, ww, wh); ctx.restore();
        }
      }
    } else {
      const {x, y} = getPosition(pos, canvas.width, canvas.height, ww, wh);
      ctx.save(); ctx.translate(x, y); ctx.rotate(rotation);
      ctx.drawImage(wmImg, -ww/2, -wh/2, ww, wh); ctx.restore();
    }
  }

  ctx.globalAlpha = 1;
  return canvas;
}

function getPosition(pos, cw, ch, ww, wh) {
  const margin = Math.min(cw, ch) * 0.05;
  const map = {
    'top-left':      [margin + ww/2, margin + wh/2],
    'top-center':    [cw/2, margin + wh/2],
    'top-right':     [cw - margin - ww/2, margin + wh/2],
    'center-left':   [margin + ww/2, ch/2],
    'center':        [cw/2, ch/2],
    'center-right':  [cw - margin - ww/2, ch/2],
    'bottom-left':   [margin + ww/2, ch - margin - wh/2],
    'bottom-center': [cw/2, ch - margin - wh/2],
    'bottom-right':  [cw - margin - ww/2, ch - margin - wh/2],
  };
  const [x, y] = map[pos] || [cw/2, ch/2];
  return {x, y};
}

// ===== PREVIEW =====
function updatePreview() {
  if (!state.files.length) {
    document.getElementById('previewCanvas').style.display = 'none';
    document.getElementById('previewEmpty').style.display = '';
    return;
  }
  const f = state.files[state.previewIndex];
  if (!f) return;
  const canvas = applyWatermark(f.img);
  const previewCanvas = document.getElementById('previewCanvas');
  previewCanvas.width = canvas.width;
  previewCanvas.height = canvas.height;
  previewCanvas.getContext('2d').drawImage(canvas, 0, 0);
  previewCanvas.style.display = '';
  document.getElementById('previewEmpty').style.display = 'none';
}

document.getElementById('refreshPreview').addEventListener('click', updatePreview);

// ===== BATCH PROCESS =====
document.getElementById('btnProcess').addEventListener('click', async () => {
  if (!state.files.length) return;
  const btn = document.getElementById('btnProcess');
  btn.disabled = true;
  const progressWrap = document.getElementById('progressWrap');
  const progressFill = document.getElementById('progressFill');
  const progressText = document.getElementById('progressText');
  progressWrap.style.display = '';
  state.processedBlobs = [];
  const format = document.getElementById('outputFormat').value;
  const quality = parseInt(document.getElementById('outputQuality').value) / 100;

  for (let i = 0; i < state.files.length; i++) {
    progressText.textContent = `處理中 ${i + 1} / ${state.files.length}`;
    progressFill.style.width = ((i + 1) / state.files.length * 100) + '%';
    state.files[i].processed = false;
    renderGrid();
    await new Promise(r => setTimeout(r, 10));
    const canvas = applyWatermark(state.files[i].img);
    const blob = await new Promise(r => canvas.toBlob(r, format, quality));
    state.processedBlobs.push(blob);
    state.files[i].processed = true;
  }

  renderGrid(); updateStats();
  progressText.textContent = `✓ 全部完成！共 ${state.files.length} 張`;
  document.getElementById('btnDownloadAll').disabled = false;
  btn.disabled = false;
  showToast(`${state.files.length} 張圖片處理完成！`);
});

// ===== DOWNLOAD ALL (ZIP) =====
document.getElementById('btnDownloadAll').addEventListener('click', async () => {
  if (!state.processedBlobs.length) { showToast('請先執行批次處理', 'error'); return; }
  const format = document.getElementById('outputFormat').value;
  const ext = format.split('/')[1];
  if (!window.JSZip) {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
    document.head.appendChild(s);
    await new Promise(r => s.onload = r);
  }
  const zip = new JSZip();
  state.processedBlobs.forEach((blob, i) => {
    const orig = state.files[i].file.name.replace(/\.[^.]+$/, '');
    zip.file(`${orig}_watermark.${ext}`, blob);
  });
  const zipBlob = await zip.generateAsync({ type: 'blob' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(zipBlob);
  a.download = 'watermarked_images.zip';
  a.click();
  showToast('ZIP 下載已開始！');
});

// ===== CLEAR =====
document.getElementById('btnClear').addEventListener('click', () => {
  state.files = []; state.processedBlobs = []; state.previewIndex = 0;
  renderGrid(); updateStats(); updatePreview();
  document.getElementById('btnDownloadAll').disabled = true;
  document.getElementById('btnProcess').disabled = true;
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('fileInput').value = '';
  showToast('已清除所有圖片');
});

// ===== STATS =====
function updateStats() {
  document.getElementById('statTotal').textContent = state.files.length;
  document.getElementById('statDone').textContent = state.files.filter(f => f.processed).length;
}
